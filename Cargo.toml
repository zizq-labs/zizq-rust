[package]
name = "zizq"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust Client for the Zizq Job Queue"
license = "MIT"
repository = "https://github.com/zizq-labs/zizq-rust"
readme = "README.md"
homepage = "https://zizq.io"
documentation = "https://zizq.io/docs/clients/rust/"
keywords = ["job-queue", "message-queue", "background-worker", "cron", "scheduler"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["serde", "macros"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
