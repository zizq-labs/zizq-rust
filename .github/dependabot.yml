# Dependabot version updates for the Rust client.
# Security advisories + Dependabot alerts are configured separately
# in Settings → Code security and analysis.
#
# Strategy: weekly grouped patch+minor PRs, `versioning-strategy:
# lockfile-only` so Cargo.toml constraints don't get auto-bumped — only
# Cargo.lock moves, keeping dev/CI on the latest resolved versions.
# Public-facing `[dependencies]` stays stable for crate consumers.
# Cargo's default `^X` semver already accepts future patch/minor
# releases through the lockfile alone.
#
# Note: Dependabot doesn't support per-dependency-type versioning
# strategy in a single cargo entry. Security advisories override this
# and PR regardless via Dependabot security updates.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    versioning-strategy: "lockfile-only"
    groups:
      cargo-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
