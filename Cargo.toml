[workspace]
resolver = "2"
members = ["zizq"]

# Fields inherited by workspace members via `field.workspace = true`
# in their own `[package]` section. Bumping the version here bumps
# every member in lockstep — see bump-version.sh.
[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zizq-labs/zizq-rust"
homepage = "https://zizq.io"

# Reserved for future use — the `zizq` crate will pin `zizq-derive`
# to an exact version here once the proc-macro sibling lands.
[workspace.dependencies]
