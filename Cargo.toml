[workspace]
resolver = "2"
members = ["zizq", "zizq-derive"]

# Fields inherited by workspace members via `field.workspace = true`
# in their own `[package]` section. Bumping the version here bumps
# every member in lockstep — see bump-version.sh.
[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zizq-labs/zizq-rust"
homepage = "https://zizq.io"

# The `zizq` crate pins `zizq-derive` to an exact version — see
# `[dependencies]` in `zizq/Cargo.toml`. Version and path resolve
# through the workspace here so bump-version.sh only needs to touch
# `[workspace.package]` above.
[workspace.dependencies]
zizq-derive = { version = "=0.6.0", path = "zizq-derive" }
