name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-check-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, all features)
        run: cargo clippy --all-targets --all-features

      # `--all-features` enables both TLS backends, and `load_identity`
      # gives rustls precedence when both are on — so the native-tls
      # code path needs its own explicit run to be compiled and linted.
      - name: cargo clippy zizq (native-tls, no derive)
        run: cargo clippy -p zizq --all-targets --no-default-features --features native-tls

      - name: cargo clippy zizq (rustls-tls, no derive)
        run: cargo clippy -p zizq --all-targets --no-default-features --features rustls-tls

      - name: cargo clippy zizq (no TLS, no derive)
        run: cargo clippy -p zizq --all-targets --no-default-features

      # Confirm the `zizq` crate builds and tests cleanly with the
      # `derive` feature (and each TLS backend) off — the user opt-out
      # path. Also runs zizq-derive unit tests in isolation for
      # visibility (they're also included in the workspace `cargo test`
      # in the `test` job below).
      - name: Test zizq feature combinations
        run: |
          cargo test -p zizq --no-default-features --features rustls-tls
          cargo test -p zizq --no-default-features --features native-tls
          cargo test -p zizq --no-default-features --features derive
          cargo test -p zizq --no-default-features
          cargo test -p zizq-derive

  test:
    name: Test (Rust ${{ matrix.rust-version }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-

      - name: Rust version
        run: rustc --version

      - name: Test
        run: cargo test

  package:
    name: Package
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-package-

      - name: Read version
        id: version
        run: echo "version=$(cargo pkgid -p zizq | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          # Drop any packaged artifacts a restored `target/` cache
          # carries forward from an earlier version's build, so they
          # don't accumulate in the cache indefinitely. The upload
          # paths are version-pinned regardless, so this is hygiene.
          rm -f target/release/zizq-* target/release/zizq-derive-*
          ./release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zizq-rust-package
          path: |
            target/release/zizq-${{ steps.version.outputs.version }}.crate
            target/release/zizq-${{ steps.version.outputs.version }}.crate.sha256
            target/release/zizq-derive-${{ steps.version.outputs.version }}.crate
            target/release/zizq-derive-${{ steps.version.outputs.version }}.crate.sha256

  # --- Integration ---
  # Builds the packaged `.crate` artifact against a real Zizq server:
  # downloads a major-version-compatible server build from the
  # zizq-labs/zizq repo (via CROSS_REPO_TOKEN), pulls the packaged
  # client from the zizq-rust-package artifact, and runs the
  # integration suite against the pair.

  integration:
    name: Integration
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Find and download latest compatible server build
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          version="${{ needs.package.outputs.version }}"
          client/.github/scripts/find-server-build.sh "${version%%.*}" server

      - name: Download client artifact
        uses: actions/download-artifact@v8
        with:
          name: zizq-rust-package
          path: artifact

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          # Explicit-match globs — `zizq-*.crate` on its own would
          # also pick up `zizq-derive-*.crate`. Split them so each
          # arg lands on its intended crate.
          ZIZQ_CRATE=(${{ github.workspace }}/artifact/zizq-[0-9]*.crate)
          DERIVE_CRATE=(${{ github.workspace }}/artifact/zizq-derive-*.crate)
          ARGS=(
            --binary ${{ github.workspace }}/server/zizq
            --crate "${ZIZQ_CRATE[0]}"
            --macro-crate "${DERIVE_CRATE[0]}"
          )
          if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
            ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
          fi
          ./integration/run.sh "${ARGS[@]}"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Required checks failed or were skipped."
            echo "  Test: ${{ needs.test.result }}"
            echo "  Integration: ${{ needs.integration.result }}"
            exit 1
          fi

  publish:
    name: Publish Release
    needs: [gate, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publish both crates in a single `cargo publish` invocation.
      # Cargo topologically orders the members (`zizq-derive` before
      # `zizq`) and resolves `zizq`'s version-pinned dep against the
      # just-uploaded sibling via its own coordination — no explicit
      # index-lag retry loop needed. Explicit `-p` names (rather
      # than `--workspace`) keeps this stable if the workspace ever
      # grows dev-only members.
      #
      # This is the irreversible step, so it runs before the steps
      # below that create `artifacts/` and `release-notes.md` — a
      # failure leaves nothing else done.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p zizq-derive -p zizq

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: zizq-rust-package
          path: artifacts

      - name: Extract release notes from CHANGELOG
        run: |
          version=${{ needs.package.outputs.version }}
          sed -n "/^## ${version}/,/^## /p" zizq/CHANGELOG.md | head -n -1 | tail -n +2 > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.package.outputs.version }}
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file release-notes.md \
            "artifacts/zizq-${version}.crate" \
            "artifacts/zizq-${version}.crate.sha256" \
            "artifacts/zizq-derive-${version}.crate" \
            "artifacts/zizq-derive-${version}.crate.sha256"
