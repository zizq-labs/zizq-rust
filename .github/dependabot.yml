# Dependabot version updates for the Rust client.
# Security advisories + Dependabot alerts are configured separately
# in Settings → Code security and analysis.
#
# Strategy: weekly grouped patch+minor PRs, `versioning-strategy:
# lockfile-only` so Cargo.toml constraints don't get auto-bumped — only
# Cargo.lock moves, keeping dev/CI on the latest resolved versions.
# Public-facing `[dependencies]` stays stable for crate consumers.
# Cargo's default `^X` semver already accepts future patch/minor
# releases through the lockfile alone.
#
# Note: Dependabot doesn't support per-dependency-type versioning
# strategy in a single cargo entry. Security advisories override this
# and PR regardless via Dependabot security updates.
#
# The example apps under `examples/` have their own lockfiles and
# are NOT covered by the root entry, so `/examples/*` matches them
# all. This is a glob deliberately: a directory missing from the
# list is invisible to version updates *and* to the automatic PRs
# that fix a security advisory, so an alert gets raised and then
# never patched. Adding an example should not require remembering
# to edit this file.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      # Every example app with its own manifest.
      - "/examples/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    versioning-strategy: "lockfile-only"
    # time 0.3.46+ raised its MSRV beyond 1.85. We don't use the
    # vulnerable RFC 2822 parser path (advisory dismissed as not
    # applicable, plus clippy.toml `disallowed-types` guard prevents
    # introducing it). Stay on 0.3.45 until we choose to bump our
    # MSRV — remove these ignores then.
    ignore:
      - dependency-name: "time"
        versions: [">= 0.3.46"]
      - dependency-name: "time-macros"
        versions: [">= 0.2.26"]
      - dependency-name: "time-core"
        versions: [">= 0.1.8"]
    groups:
      cargo-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
