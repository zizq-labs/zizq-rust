[package]
name = "zizq-integration"
version = "0.0.0"
edition = "2021"
publish = false

# The `zizq` dependency is a `path` dependency pointing at `./zizq`,
# which `run.sh` populates by extracting the packaged `.crate`
# artifact. The integration tests therefore build against the exact
# published artifact, not the local source tree. The path is stable
# (always `./zizq`) regardless of the crate version.
# TODO: re-enable the `derive` feature (default-on in `zizq`) once
# `run.sh` learns to unpack the `zizq-derive` sibling `.crate` and
# points at it via `[patch.crates-io]`. Until then, the packaged
# `zizq.crate` we build against here would try to resolve
# `zizq-derive` from crates.io, which fails before the sibling is
# published. Opting out keeps integration tests decoupled from the
# derive rollout.
[dev-dependencies]
zizq = { path = "zizq", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
