[package]
name = "zizq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Official Rust Client for the Zizq Job Queue"
readme = "README.md"
documentation = "https://zizq.io/docs/clients/rust/"
keywords = ["job-queue", "message-queue", "background-worker", "cron", "scheduler"]
categories = ["asynchronous", "api-bindings"]
exclude = ["examples/"]

[features]

## Default: pure-Rust TLS (`rustls-tls`) plus the `#[derive(JobKind)]`
## macro (`derive`).
default = ["rustls-tls", "derive"]

## Pure-Rust TLS via `rustls`. No system OpenSSL dependency. Enable
## exactly one of `rustls-tls` or `native-tls`.
rustls-tls = ["reqwest/rustls-tls"]

## System TLS via the platform's native library (OpenSSL on Linux,
## SChannel on Windows, Secure Transport on macOS). Enable this
## instead of `rustls-tls` when you need to inherit the OS's
## certificate store or PKI configuration.
native-tls = ["reqwest/native-tls"]

## `#[derive(JobKind)]` — a proc-macro that generates the trait
## implementation from `#[zizq(...)]` attributes on your payload
## struct. Disable if you prefer to write the `impl JobKind` block by
## hand and skip the proc-macro compile-time cost.
derive = ["dep:zizq-derive"]

[dependencies]
zizq-derive = { workspace = true, optional = true }
document-features = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rmp-serde = "1"
erased-serde = "0.4"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["serde", "macros"] }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
