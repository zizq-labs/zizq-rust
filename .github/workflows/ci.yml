name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-check-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

      # `--all-features` enables both TLS backends, and `load_identity`
      # gives rustls precedence when both are on — so the native-tls
      # code path needs its own explicit run to be compiled and linted.
      - name: cargo clippy (native-tls backend)
        run: cargo clippy --all-targets --no-default-features --features native-tls

      - name: cargo clippy (no TLS)
        run: cargo clippy --all-targets --no-default-features

      - name: Test feature combinations
        run: |
          cargo test --no-default-features --features native-tls
          cargo test --no-default-features

  test:
    name: Test (Rust ${{ matrix.rust-version }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-test-${{ matrix.rust-version }}-

      - name: Rust version
        run: rustc --version

      - name: Test
        run: cargo test

  package:
    name: Package
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-package-

      - name: Read version
        id: version
        run: echo "version=$(cargo pkgid | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: |
          # Drop any packaged artifacts a restored `target/` cache
          # carries forward from an earlier version's build, so they
          # don't accumulate in the cache indefinitely. The upload
          # path is version-pinned regardless, so this is hygiene.
          rm -f target/release/zizq-*
          ./release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-rust-package
          path: |
            target/release/zizq-${{ steps.version.outputs.version }}.crate
            target/release/zizq-${{ steps.version.outputs.version }}.crate.sha256

  # --- Integration ---
  # Builds the packaged `.crate` artifact against a real Zizq server:
  # downloads a major-version-compatible server build from the
  # zizq-labs/zizq repo (via CROSS_REPO_TOKEN), pulls the packaged
  # client from the zizq-rust-package artifact, and runs the
  # integration suite against the pair.

  integration:
    name: Integration
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Find and download latest compatible server build
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          version="${{ needs.package.outputs.version }}"
          client/.github/scripts/find-server-build.sh "${version%%.*}" server

      - name: Download client artifact
        uses: actions/download-artifact@v8
        with:
          name: zizq-rust-package
          path: artifact

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(--binary ${{ github.workspace }}/server/zizq --crate ${{ github.workspace }}/artifact/zizq-*.crate)
          if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
            ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
          fi
          ./integration/run.sh "${ARGS[@]}"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Required checks failed or were skipped."
            echo "  Test: ${{ needs.test.result }}"
            echo "  Integration: ${{ needs.integration.result }}"
            exit 1
          fi

  publish:
    name: Publish Release
    needs: [gate, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` re-packages the crate from source (it cannot
      # consume a pre-built `.crate`) and refuses to run on a dirty
      # working tree. Run it first, before the steps below create
      # `artifacts/` and `release-notes.md` — and, since it is the
      # irreversible step, a failure here leaves nothing else done.
      #
      # `--no-verify` skips the redundant verification rebuild: the
      # `test` and `integration` jobs have already built and tested
      # this crate (integration builds the packaged `.crate` itself).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: zizq-rust-package
          path: artifacts

      - name: Extract release notes from CHANGELOG
        run: |
          version=${{ needs.package.outputs.version }}
          sed -n "/^## ${version}/,/^## /p" CHANGELOG.md | head -n -1 | tail -n +2 > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.package.outputs.version }}
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file release-notes.md \
            "artifacts/zizq-${version}.crate" \
            "artifacts/zizq-${version}.crate.sha256"
